name: Site checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 13 1 * *"  # monthly, catches security.txt nearing expiry

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python tools/check_site.py
